<!DOCTYPE html>
<html lang="ko" class="big-text">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자료실 | 노진교회</title>
  <meta name="robots" content="noindex" />
  <!-- 2026-09-29: 자료실(교육·예배 자료실, 앱 설치 안내)은 모두 '행정'(office.html)으로 옮김.
       옛 주소(library.html#edu 등)로 들어오면 행정 페이지의 같은 자리로 바로 보낸다. -->
  <meta http-equiv="refresh" content="0; url=office.html#edu" />
  <script>
    (function () {
      var map = { "#edu": "#edu", "#worship": "#worship-lib", "#app": "#app" };
      location.replace("office.html" + (map[location.hash] || "#edu"));
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;padding:40px;text-align:center">자료실은 ‘행정’ 메뉴로 옮겼습니다. <a href="office.html#edu">행정으로 가기 →</a></p>
</body>
</html>
