<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주일 오후예배 | 노진교회</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1A3A2F" />
  <link rel="icon" href="images/favicon-32.png?v=20260926icon2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261028see" />
  <style>
    .pm-page { max-width: 720px; margin: 0 auto; padding: 96px 16px 60px; }
    .pm-head { text-align: center; margin-bottom: 26px; }
    .pm-head small { display: block; color: #7b8794; font-size: .86rem; letter-spacing: .02em; }
    .pm-head h1 { font-family: 'Gowun Batang', serif; color: #1A3A2F; font-size: 1.9rem; margin: 8px 0 4px; }
    .pm-head .pm-ref { color: #BFA06C; font-weight: 700; }
    .pm-v { background: #fff; border: 1px solid #ece7d8; border-left: 4px solid #BFA06C; border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
    .pm-v .r { font-weight: 700; color: #1A3A2F; font-size: .92rem; margin-bottom: 6px; }
    .pm-v p { margin: 0; font-family: 'Gowun Batang', serif; font-size: 1.12rem; line-height: 1.85; color: #222; }
    .pm-v p sup { color: #BFA06C; font-family: 'Noto Sans KR', sans-serif; font-size: .7em; margin-right: 3px; }
    .pm-v.main { background: #F6F4EB; border-left-color: #1A3A2F; }
    .pm-wait { text-align: center; color: #52606d; padding: 60px 0; font-size: 1.05rem; line-height: 1.8; }
    .pm-song { background: #fff; border: 1px solid #ece7d8; border-top: 4px solid #BFA06C; border-radius: 12px; padding: 14px; text-align: center; }
    .pm-song .t { font-weight: 700; color: #1A3A2F; margin-bottom: 10px; }
    .pm-song img { width: 100%; height: auto; display: block; border-radius: 6px; }
    .pm-foot { text-align: center; color: #9aa5b1; font-size: .8rem; margin-top: 20px; }
  </style>
</head>
<body>
  <!-- 2026-11-08 목사님: 추수감사주일 오후예배 설교 후 찬양 악보(감사하신 하나님/에벤에셀 하나님, 홍정식, A조). 13:50부터 보임, ?go 미리 보기. 11/1 구절 판은 git 기록에 -->
  <main class="pm-page">
    <div class="pm-head">
      <small>노진교회 추수감사주일 오후예배 · 2026. 11. 8.</small>
      <h1>설교 후 찬양</h1>
      <div class="pm-ref">감사하신 하나님 (에벤에셀 하나님)</div>
    </div>
    <div id="pmBody"></div>
    <p class="pm-foot">악보: 홍정식 「감사하신 하나님」 · 손가락으로 벌려 크게 보실 수 있어요</p>
  </main>

  <template id="pmVerses">
    <div class="pm-song"><div class="t">🎵 감사하신 하나님 (A)</div><img src="images/pm/20261108_thanks_god_A.webp" alt="감사하신 하나님(에벤에셀 하나님) 악보" /></div>
  </template>

  <script src="js/church.js?v=20261009wl"></script>
  <script src="js/brand.js?v=1"></script>
  <script src="js/config.js?v=20261011ts"></script>
  <script src="js/layout.js?v=20261031end"></script>
  <script>
    // 한국 시각 2026-11-08 13:50 부터 보임(그 전에는 안내)
    (function () {
      var OPEN = Date.UTC(2026, 10, 8, 4, 50); // 13:50 KST
      var body = document.getElementById('pmBody');
      function draw() {
        if (Date.now() >= OPEN || /[?&]go\b/.test(location.search)) { body.innerHTML = document.getElementById('pmVerses').innerHTML; return; }
        body.innerHTML = '<div class="pm-wait">11월 8일 오후예배 때 찬양 악보가 열립니다.<br>조금만 기다려 주세요.</div>';
        setTimeout(draw, Math.min(OPEN - Date.now() + 500, 30000));
      }
      draw();
      window.addEventListener('load', function () { setTimeout(draw, 300); });
    })();
  </script>
</body>
</html>
