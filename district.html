<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교구사역 | 노진교회</title>
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="manifest.json?v=20260730lib13" />
  <meta name="theme-color" content="#223350" />
  <link rel="icon" href="images/favicon-32.png?v=20260730lib13" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=20260730lib13" />
  <meta name="apple-mobile-web-app-title" content="노진교회" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20260822district" />
  <style>
    .fin-wrap{max-width:1080px}
    .fin-tabs{display:flex;gap:6px;border-bottom:2px solid var(--line,#e3e7ee);margin:8px 0 20px;flex-wrap:wrap}
    .fin-tabs button{position:relative;background:none;border:none;padding:10px 16px;font-weight:700;color:var(--ink-soft,#7b8794);cursor:pointer;font-family:inherit;transition:color .2s ease,transform .2s ease}
    .fin-tabs button::after{content:"";position:absolute;left:14px;right:14px;bottom:-2px;height:3px;border-radius:3px;background:var(--accent,#223350);transform:scaleX(0);transform-origin:center;transition:transform .28s cubic-bezier(.4,0,.2,1)}
    .fin-tabs button:hover{color:var(--accent,#223350);transform:translateY(-1px)}
    .fin-tabs button.active{color:var(--accent,#223350)}
    .fin-tabs button.active::after{transform:scaleX(1)}
    .fin-card{background:#fff;border:1px solid var(--line,#e3e7ee);border-radius:12px;padding:20px;margin-bottom:18px}
    .fin-table{width:100%;border-collapse:collapse;font-size:.92rem}
    .fin-table th,.fin-table td{padding:9px 10px;border-bottom:1px solid var(--line,#eef1f5);text-align:left}
    .fin-table td.num,.fin-table th.num{text-align:right;font-variant-numeric:tabular-nums}
    .fin-table tfoot td{font-weight:700;background:#f7f9fc}

    /* 보고서 입력 */
    .dr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
    .dr-f label{display:block;font-size:.82rem;color:var(--ink-soft,#7b8794);margin-bottom:5px;font-weight:500}
    .dr-f input,.dr-f select,.dr-f textarea{width:100%;padding:9px 11px;border:1px solid #dfe5ee;border-radius:9px;font:inherit;box-sizing:border-box;background:#fff}
    .dr-f textarea{min-height:96px;resize:vertical;line-height:1.7}
    .dr-f input:focus,.dr-f select:focus,.dr-f textarea:focus{outline:none;border-color:var(--accent,#223350)}
    .dr-sec{margin:22px 0 10px;font-size:.82rem;font-weight:700;letter-spacing:.06em;color:var(--accent,#223350)}
    .dr-sec:first-of-type{margin-top:4px}
    .dr-hint{font-size:.78rem;color:var(--ink-soft,#9aa5b1);margin-top:5px}
    .dr-full{grid-column:1/-1}
    .dr-actions{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap}

    /* 나눔지 */
    .ds-list{list-style:none;padding:0;margin:0}
    .ds-list li{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line,#eef1f5)}
    .ds-list li:last-child{border-bottom:0}
    .ds-t{font-weight:600;color:var(--accent,#223350)}
    .ds-d{font-size:.8rem;color:var(--ink-soft,#9aa5b1)}
    .ds-dl{margin-left:auto}

    .dr-pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.74rem;font-weight:700;background:#eef2fa;color:#3a5178}
    .dr-none{background:#fdecea;color:#c0392b}
    .dr-msg{margin-top:12px;font-size:.9rem}
    @media (max-width:640px){ .fin-card{padding:16px} }
  </style>
</head>
<body>
  <section class="page-hero">
    <p class="ph-eyebrow">DISTRICT</p>
    <h1>교구사역</h1>
    <p>교구위원회 · 구역장과 인도자를 위한 자리입니다. 사역보고를 남기고 말씀 나눔지를 받아 가세요.</p>
  </section>

  <section class="block">
    <div class="container fin-wrap">
      <div id="dtRoot"><p class="qt-loading">권한 확인 중입니다…</p></div>
    </div>
  </section>

  <script src="js/church.js?v=20260816hist"></script>
  <script src="js/brand.js?v=1"></script>
  <script src="js/config.js?v=20260822district"></script>
  <script src="js/bulletins.js?v=20260709nojin2"></script>
  <script src="js/layout.js?v=20260822district"></script>
  <script src="js/main.js?v=20260816hist"></script>
  <script src="js/district.js?v=20260822jwt"></script>
</body>
</html>
