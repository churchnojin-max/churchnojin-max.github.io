<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위임감사예배 순서지 · 노진교회</title>
<meta name="description" content="노진교회 위임감사예배 순서지 — 2026년 10월 31일(토) 오전 11시, 노진교회당">
<meta property="og:title" content="위임감사예배 순서지 · 노진교회">
<meta property="og:description" content="2026년 10월 31일(토) 오전 11시 · 노진교회당">
<meta property="og:image" content="https://nojin.kr/order/img/cover.jpg">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.ico">
<style>
  :root { --paper:#F3EFE3; --ink:#1F2B26; --green:#1A3A2F; --gold:#BFA06C; --line:#D3D6C6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--paper); color:var(--ink); font-family:'Noto Serif KR','Apple SD Gothic Neo','Malgun Gothic',serif; }
  .top { position:sticky; top:0; z-index:5; background:rgba(243,239,227,.96); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
         display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px; }
  .top h1 { font-size:15px; font-weight:700; color:var(--green); letter-spacing:.04em; white-space:nowrap; }
  .top h1 small { display:block; font-size:11px; font-weight:400; color:#5A6A62; letter-spacing:0; margin-top:2px; }
  .btns { display:flex; gap:6px; }
  .btns a { font-size:12px; padding:7px 10px; border:1px solid var(--green); border-radius:999px; color:var(--green); text-decoration:none; white-space:nowrap; background:#fff; }
  .btns a.pdf { background:var(--green); color:#F6F4EB; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 12px 10px 40px; }
  .panel { margin: 0 0 14px; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 22px rgba(40,50,30,.14); background:#fff; }
  .panel img { display:block; width:100%; height:auto; }
  .cap { text-align:center; font-size:12px; color:#5A6A62; margin:-6px 0 16px; letter-spacing:.06em; }
  .hint { text-align:center; font-size:12.5px; color:#5A6A62; line-height:1.7; margin:4px 0 14px; }
  .foot { text-align:center; font-size:12px; color:#5A6A62; line-height:1.8; margin-top:26px; }
  .foot a { color:var(--green); }
  /* PC(900px 이상): 한 쪽씩 넘기는 보기(2026-10-30 목사님). 휴대폰은 위 세로 넘기기 그대로 */
  .viewer { display:none; }
  @media (min-width: 900px) {
    .wrap { max-width: 1240px; }
    body.pc .pages, body.pc .hint { display:none; }
    body.pc .viewer { display:block; }
    .vstage { display:grid; grid-template-columns:56px 1fr 56px; align-items:center; gap:14px; }
    .vframe { display:flex; justify-content:center; align-items:center; min-height:420px; }
    .vframe img { display:block; max-width:100%; max-height:calc(100vh - 240px); width:auto; height:auto; border-radius:8px;
                  box-shadow:0 10px 34px rgba(40,50,30,.20); background:#fff; cursor:pointer; user-select:none; }
    .vnav { width:56px; height:56px; border-radius:50%; border:1px solid var(--gold); background:#fff; color:var(--green);
            font-size:30px; line-height:1; cursor:pointer; transition:background .15s, color .15s, opacity .15s; }
    .vnav:hover { background:var(--green); color:#F6F4EB; }
    .vnav[disabled] { opacity:.28; cursor:default; }
    .vnav[disabled]:hover { background:#fff; color:var(--green); }
    .vcap { text-align:center; margin:14px 0 10px; font-size:14px; color:var(--green); letter-spacing:.08em; }
    .vcap small { color:#5A6A62; letter-spacing:0; margin-left:10px; }
    .thumbs { display:flex; justify-content:center; gap:10px; }
    .thumbs button { padding:0; border:2px solid transparent; border-radius:6px; background:none; cursor:pointer; opacity:.6; transition:opacity .15s, border-color .15s; }
    .thumbs button img { display:block; height:74px; width:auto; border-radius:4px; box-shadow:0 2px 8px rgba(40,50,30,.18); }
    .thumbs button.on, .thumbs button:hover { opacity:1; border-color:var(--gold); }
    .vhint { text-align:center; font-size:12.5px; color:#5A6A62; margin:10px 0 0; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>위임감사예배 순서지<small>2026년 10월 31일(토) 오전 11시 · 노진교회당</small></h1>
  <nav class="btns">
    <a href="../invite/order.html">글자로 보기</a>
    <a class="pdf" href="순서지.pdf" download>PDF</a>
  </nav>
</header>

<main class="wrap">
  <p class="hint">손가락 두 개로 벌리면 커집니다. 아래로 넘기며 보세요.</p>

  <div class="pages">
  <div class="panel"><img src="img/cover.jpg" alt="표지 — 노진교회 위임감사예배, 2026년 10월 31일 토요일 오전 11시 노진교회당"></div>
  <p class="cap">표 지</p>

  <div class="spread">
    <div class="panel"><img src="img/inside1.jpg" alt="순서 1면 — 1부 예배, 2부 위임식" loading="lazy"></div>
    <div class="panel"><img src="img/inside2.jpg" alt="순서 2면 — 2부 서약·공포, 3부 축하와 격려" loading="lazy"></div>
  </div>
  <p class="cap">순 서</p>

  <div class="panel"><img src="img/back.jpg" alt="뒤표지 — 위임목사 소개, 광고 및 인사" loading="lazy"></div>
  <p class="cap">위임목사 소개 · 광고</p>
  </div>

  <!-- PC: 한 쪽씩 보기(그림은 위 .pages 의 것을 그대로 씀, js 가 채움) -->
  <section class="viewer" aria-label="순서지 한 쪽씩 보기">
    <div class="vstage">
      <button type="button" class="vnav" id="vPrev" aria-label="앞 쪽">‹</button>
      <div class="vframe"><img id="vImg" src="img/cover.jpg" alt="표지"></div>
      <button type="button" class="vnav" id="vNext" aria-label="다음 쪽">›</button>
    </div>
    <p class="vcap"><span id="vName">표 지</span><small id="vNum">1 / 4</small></p>
    <div class="thumbs" id="vThumbs"></div>
    <p class="vhint">그림을 누르거나 ← → 키로 넘깁니다 · 아래 작은 그림을 눌러 바로 갈 수 있습니다</p>
  </section>

  <p class="foot">
    대한예수교장로회 노진교회 · 경기도 화성시 만세구 장안면 화곡로 159-8 · 070-4355-1598<br>
    <a href="https://nojin.kr">nojin.kr</a>
  </p>
</main>
<script>
(function () {
  // PC 에서만 한 쪽씩 보기. 휴대폰(900px 미만)은 세로로 넘기는 원래 화면
  var PAGES = [
    { src: "img/cover.jpg",   name: "표 지",          alt: "표지" },
    { src: "img/inside1.jpg", name: "순서 · 1부 예배 · 2부 위임식", alt: "순서 1면" },
    { src: "img/inside2.jpg", name: "순서 · 2부 서약 · 3부 축하와 격려", alt: "순서 2면" },
    { src: "img/back.jpg",    name: "위임목사 소개 · 광고", alt: "뒤표지" }
  ];
  var mq = window.matchMedia("(min-width: 900px)");
  var img = document.getElementById("vImg"), name = document.getElementById("vName"), num = document.getElementById("vNum");
  var prev = document.getElementById("vPrev"), next = document.getElementById("vNext"), thumbs = document.getElementById("vThumbs");
  var i = 0, built = false;
  function go(n) {
    i = Math.max(0, Math.min(PAGES.length - 1, n));
    img.src = PAGES[i].src; img.alt = PAGES[i].alt;
    name.textContent = PAGES[i].name; num.textContent = (i + 1) + " / " + PAGES.length;
    prev.disabled = i === 0; next.disabled = i === PAGES.length - 1;
    Array.prototype.forEach.call(thumbs.children, function (b, k) { b.classList.toggle("on", k === i); });
    if (i + 1 < PAGES.length) { var pre = new Image(); pre.src = PAGES[i + 1].src; }   // 다음 쪽 미리 받기
  }
  function build() {
    if (built) return; built = true;
    PAGES.forEach(function (p, k) {
      var b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", p.alt);
      b.innerHTML = '<img src="' + p.src + '" alt="">';
      b.addEventListener("click", function () { go(k); });
      thumbs.appendChild(b);
    });
    prev.addEventListener("click", function () { go(i - 1); });
    next.addEventListener("click", function () { go(i + 1); });
    img.addEventListener("click", function () { go(i + 1 < PAGES.length ? i + 1 : 0); });
    document.addEventListener("keydown", function (e) {
      if (!document.body.classList.contains("pc")) return;
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(i + 1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(i - 1); }
      if (e.key === "Home") go(0);
      if (e.key === "End") go(PAGES.length - 1);
    });
    go(0);
    setTimeout(function () { PAGES.forEach(function (p) { var im = new Image(); im.src = p.src; }); }, 800);   // 네 쪽 미리 받아 두기(넘길 때 바로 뜨게)
  }
  function apply() { document.body.classList.toggle("pc", mq.matches); if (mq.matches) build(); }
  apply();
  if (mq.addEventListener) mq.addEventListener("change", apply); else mq.addListener(apply);
})();
</script>
</body>
</html>
